<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9c8c2;stroke-width:1.5}
      .model{fill:#f2f6fc;stroke:#9ec5f4;stroke-width:1.5}
      .out{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.5}
      .t{font-size:15px;font-weight:600;fill:#0b0b0b}
      .s{font-size:13px;fill:#52514e}
      .w{font-size:15px;font-weight:600;fill:#ffffff}
      .ws{font-size:13px;fill:#e6f0fc}
      .edge{fill:none;stroke:#52514e;stroke-width:1.6;marker-end:url(#arrow)}
      .lab{font-size:12px;fill:#52514e;font-style:italic}
    </style>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <!-- input -->
  <rect class="box" x="10" y="140" width="170" height="96" rx="8"/>
  <text class="t" x="95" y="168" text-anchor="middle">Tactical tracking</text>
  <text class="s" x="95" y="188" text-anchor="middle">ATD, 25 fps</text>
  <text class="s" x="95" y="206" text-anchor="middle">46 anonymous track slots</text>
  <text class="s" x="95" y="224" text-anchor="middle">ball missing 41% of play</text>

  <!-- preparation -->
  <rect class="box" x="220" y="70" width="190" height="70" rx="8"/>
  <text class="t" x="315" y="99" text-anchor="middle">Feature extraction</text>
  <text class="s" x="315" y="119" text-anchor="middle">44 features per frame, 5 fps</text>
  <rect class="box" x="220" y="250" width="190" height="70" rx="8"/>
  <text class="t" x="315" y="279" text-anchor="middle">Track stitching</text>
  <text class="s" x="315" y="299" text-anchor="middle">11 + 11 continuous players</text>
  <path class="edge" d="M180,188 H200 V105 H218"/>
  <path class="edge" d="M200,188 V285 H218"/>

  <!-- models -->
  <rect class="model" x="450" y="20" width="200" height="64" rx="8"/>
  <text class="t" x="550" y="47" text-anchor="middle">Dead-ball Transformer</text>
  <text class="s" x="550" y="67" text-anchor="middle">P(ball dead)</text>
  <rect class="model" x="450" y="118" width="200" height="64" rx="8"/>
  <text class="t" x="550" y="145" text-anchor="middle">Temporal CNN</text>
  <text class="s" x="550" y="165" text-anchor="middle">P(Barcelona has it | live)</text>
  <rect class="model" x="450" y="253" width="200" height="64" rx="8"/>
  <text class="t" x="550" y="280" text-anchor="middle">PathCRF (pretrained)</text>
  <text class="s" x="550" y="300" text-anchor="middle">P(Barcelona has it | live)</text>
  <path class="edge" d="M410,105 H430 V52 H448"/>
  <path class="edge" d="M430,105 V150 H448"/>
  <path class="edge" d="M410,285 H448"/>

  <!-- fusion -->
  <circle class="box" cx="700" cy="218" r="23"/>
  <text class="s" x="700" y="222" text-anchor="middle" font-weight="600">mean</text>
  <path class="edge" d="M650,150 H700 V193"/>
  <path class="edge" d="M650,285 H700 V243"/>

  <!-- decoding -->
  <rect class="box" x="760" y="110" width="190" height="64" rx="8"/>
  <text class="t" x="855" y="137" text-anchor="middle">Viterbi decoder</text>
  <text class="s" x="855" y="157" text-anchor="middle">H · A · D with switch costs</text>
  <rect class="box" x="760" y="200" width="190" height="52" rx="8"/>
  <text class="t" x="855" y="231" text-anchor="middle">2-second control rule</text>
  <rect class="out" x="760" y="278" width="190" height="56" rx="8"/>
  <text class="w" x="855" y="302" text-anchor="middle">Possession labels</text>
  <text class="ws" x="855" y="321" text-anchor="middle">every frame, 25 fps</text>
  <path class="edge" d="M650,52 H855 V108"/>
  <text class="lab" x="700" y="45">dead-ball head</text>
  <path class="edge" d="M723,218 H740 V142 H758"/>
  <text class="lab" x="670" y="222" text-anchor="end">possession head</text>
  <path class="edge" d="M855,174 V198"/>
  <path class="edge" d="M855,252 V276"/>
</svg>
