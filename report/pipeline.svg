<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3936"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#9b9a94;stroke-width:1.6}
      .model{fill:#eef4fc;stroke:#5598e7;stroke-width:1.6}
      .out{fill:#2a78d6;stroke:#2a78d6;stroke-width:1.6}
      .t{font-size:21px;font-weight:700;fill:#0b0b0b}
      .s{font-size:18px;fill:#3a3936}
      .m{font-size:18px;font-style:italic;fill:#3a3936}
      .w{font-size:21px;font-weight:700;fill:#ffffff}
      .ws{font-size:18px;fill:#e6f0fc}
      .edge{fill:none;stroke:#3a3936;stroke-width:1.7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <!-- input -->
  <rect class="box" x="10" y="130" width="170" height="112" rx="6"/>
  <text class="t" x="95" y="160" text-anchor="middle">Tracking</text>
  <text class="s" x="95" y="184" text-anchor="middle">25 fps</text>
  <text class="s" x="95" y="206" text-anchor="middle">46 anonymous slots</text>
  <text class="s" x="95" y="228" text-anchor="middle">ball missing 41%</text>

  <!-- preparation -->
  <rect class="box" x="215" y="62" width="190" height="72" rx="6"/>
  <text class="t" x="310" y="93" text-anchor="middle">Features</text>
  <text class="s" x="310" y="119" text-anchor="middle">44 per frame, 5 fps</text>
  <rect class="box" x="215" y="246" width="190" height="72" rx="6"/>
  <text class="t" x="310" y="277" text-anchor="middle">Track stitching</text>
  <text class="s" x="310" y="303" text-anchor="middle">11 + 11 players</text>
  <path class="edge" d="M180,186 H198 V98 H213"/>
  <path class="edge" d="M198,186 V282 H213"/>

  <!-- networks -->
  <rect class="model" x="445" y="14" width="200" height="68" rx="6"/>
  <text class="t" x="545" y="43" text-anchor="middle">Transformer</text>
  <text class="m" x="545" y="69" text-anchor="middle">p(dead)</text>
  <rect class="model" x="445" y="112" width="200" height="68" rx="6"/>
  <text class="t" x="545" y="141" text-anchor="middle">Temporal CNN</text>
  <text class="m" x="545" y="167" text-anchor="middle">p(home | live)</text>
  <rect class="model" x="445" y="248" width="200" height="68" rx="6"/>
  <text class="t" x="545" y="277" text-anchor="middle">PathCRF</text>
  <text class="m" x="545" y="303" text-anchor="middle">p(home | live)</text>
  <path class="edge" d="M405,98 H425 V48 H443"/>
  <path class="edge" d="M425,98 V146 H443"/>
  <path class="edge" d="M405,282 H443"/>

  <!-- fusion -->
  <circle class="box" cx="700" cy="214" r="27"/>
  <text class="s" x="700" y="220" text-anchor="middle" font-weight="700">mean</text>
  <path class="edge" d="M645,146 H700 V185"/>
  <path class="edge" d="M645,282 H700 V243"/>

  <!-- decoding -->
  <rect class="box" x="755" y="104" width="195" height="68" rx="6"/>
  <text class="t" x="852" y="133" text-anchor="middle">Viterbi decoder</text>
  <text class="s" x="852" y="159" text-anchor="middle">states H, A, D</text>
  <rect class="box" x="755" y="198" width="195" height="54" rx="6"/>
  <text class="t" x="852" y="232" text-anchor="middle">2 s control rule</text>
  <rect class="out" x="755" y="278" width="195" height="58" rx="6"/>
  <text class="w" x="852" y="303" text-anchor="middle">Labels</text>
  <text class="ws" x="852" y="326" text-anchor="middle">every frame, 25 fps</text>
  <path class="edge" d="M645,48 H852 V102"/>
  <path class="edge" d="M727,214 H740 V138 H753"/>
  <path class="edge" d="M852,172 V196"/>
  <path class="edge" d="M852,252 V276"/>
</svg>
