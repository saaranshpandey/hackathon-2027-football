[project]
name = "possession"
version = "0.1.0"
description = "More than a Hack 2027, Phase 1: frame-level ball possession from tracking data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "kloppy==3.18.0",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
